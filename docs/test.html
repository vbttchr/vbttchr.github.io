<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MWE Reset</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      padding: 2rem;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      margin-bottom: 1rem;
    }

    ul li a {
      display: inline-block;
      position: relative;
      color: black;
      text-decoration: none;
      transform: skew(0deg);
      transition: color 0.3s ease, transform 0.3s ease;
    }

    ul li a:hover {
      color: crimson;
      transform: skew(-30deg);
    }

    ul li a::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -3px;
      width: 0;
      height: 2px;
      background: #696969;
      transform: translateX(-50%);
      transition: width 0.3s ease;
    }

    ul li a:hover::after {
      width: 100%;
    }
  </style>
</head>
<body>

  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Contact</a></li>
  </ul>

</body>
</html>
