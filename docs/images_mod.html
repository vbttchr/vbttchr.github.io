</main>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const entries = document.querySelectorAll('.entry-wrapper');
    const scale = 1.5;
    let focusedEntry = null;

    entries.forEach(entry => {
        entry.dataset.focused = "false"; // Ensure it's initialized
        entry.addEventListener('click', () => {
            const isFocused = entry.dataset.focused === "true";
            const entryInfo = entry.querySelector('.entry-info');
            const entryBox = entry.querySelector('.entry-box')
            const rect = entryBox.querySelector('rect')
            if (isFocused) {
                // Remove transform to animate back to normal
                entry.style.transform = 'none';
                entry.style.transform = `scale(-0.25) translate(0px, 0px)`;
                entryInfo.style.transform = 'none';
                entryBox.style.transform = 'none';
                // Wait for transition to finish before lowering z-index
                const handleTransitionEnd = () => {
                    entry.style.zIndex = 1; // Send to back
                    entry.dataset.focused = "false";
                    entry.removeEventListener('transitionend', handleTransitionEnd);
                    entry.style.transform = `scale(1)`;
                };

                entry.addEventListener('transitionend', handleTransitionEnd);
                
                focusedEntry = null;
            } else {
                // If another entry is focused, do nothing (or defocus it if you want)
                if (focusedEntry && focusedEntry !== entry) return;
                
                const rect = entry.getBoundingClientRect();
                const viewportCenterX = window.innerWidth / 2;
                const viewportCenterY = window.innerHeight / 2;

                const entryCenterX = rect.left + rect.width / 2;
                const entryCenterY = rect.top + rect.height / 2;

                const offsetX = (viewportCenterX - entryCenterX) / scale;
                const offsetY = (viewportCenterY - entryCenterY) / scale;

                entry.style.transform = `scale(${scale}) translate(${offsetX}px, ${offsetY}px)`;
                entry.style.zIndex = 10;
                // if (!block) return;

                const entryInfoHeight = entryInfo.offsetHeight;

                // Translate the block down by its own height
                entryInfo.style.transform = `translateY(${entryInfoHeight}px)`;
                entryBox.style.transform = `translateY(${entryInfoHeight}px)`;
                entry.dataset.focused = "true";
                focusedEntry = entry;
            }
        });
    });
});
</script>
