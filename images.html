<script>
window.addEventListener("load", () => {
  initEntries();
});
// document.addEventListener("DOMContentLoaded", () => {

function initEntries() {
  const entries = document.querySelectorAll('.entry-wrapper');
  const overlay = document.querySelector('.overlay')
  const scale = 1.4;
  let currFocusedEntry = null;

  entries.forEach(entry => {
    // Define important metrics
    const entryInfo = entry.querySelector('.entry-info');
    const entryBox = entry.querySelector('.entry-box-svg');

    const boxRect = entryBox.querySelector('#entry-box-rect');
    const boxRectClipPath = entry.querySelector('#entry-box-clip-path-rect');
    if(boxRect==null) {return}
    const boxRectSizeInfo = boxRect.getBoundingClientRect();
    const strokeWidth = parseFloat(getComputedStyle(boxRect).strokeWidth);

    const pinSvgContainer = entry.querySelector('.logo-column')
    const pinPath = pinSvgContainer.querySelector('#map-pin');
    const pinPathLength = pinPath.getTotalLength()
    // Introduce curvature to box rect and its cor. clip path
    const radius = 20;
    boxRect.setAttribute('rx',`${radius}`)
    boxRect.setAttribute('ry',`${radius}`)
    boxRectClipPath.setAttribute('rx',`${radius}`)
    boxRectClipPath.setAttribute('ry',`${radius}`)

    const xLen = boxRectSizeInfo.width-strokeWidth - 2 * radius;
    const yLen = boxRectSizeInfo.height-strokeWidth - 2 * radius;
    const rLen = (2 * 3.14156265 * radius)/4;
    const boxRectLength = 2 * xLen + 2 * yLen + 4 * rLen;
    console.log(`boxRectLength: ${boxRectLength}`)

    function setRect() {
      boxRect.style.setProperty('--StrokeDashOffset',`${-xLen/2}`) 
      boxRect.style.setProperty('--StrokeDashArray', `0,${boxRectLength}`)
      boxRect.classList.remove('grow-transition');
      boxRect.classList.remove('shrink-transition')
      entry.classList.remove('grow-transition')
      entry.classList.remove('shrink-transition')
    }

    function setPin() {
      pinPath.style.setProperty('--StrokeDashOffset',`${-xLen/2}`) 
      pinPath.style.setProperty('--StrokeDashArray', `0,${pinPath}`)
      pinPath.classList.remove('grow-transition');
      pinPath.classList.remove('shrink-transition');
    }
    setRect()

    entry.dataset.focused = "false";

    entry.addEventListener('click', () => {
      function focusRect() {
        if (currFocusedEntry && currFocusedEntry !== entry) return;
        boxRect.classList.add('grow-transition')
        pinPath.classList.add('grow-transition')
        entry.classList.add('grow-transition')
        entry.classList.add('z-top')
        const rect = entry.getBoundingClientRect();
        const viewportCenterX = window.innerWidth / 2;
        const viewportCenterY = window.innerHeight / 2;

        const entryCenterX = rect.left + rect.width / 2;
        const entryCenterY = rect.top + rect.height / 2;

        const offsetX = (viewportCenterX - entryCenterX) / scale;
        const offsetY = (viewportCenterY - entryCenterY) / scale;

        entry.style.transform = `scale(${scale}) translate(${offsetX}px, ${offsetY}px)`;
      
        const entryInfoHeight = entryInfo.offsetHeight;

        // Translate the block down by its own height
        entryInfo.style.transform = `translateY(${entryInfoHeight+strokeWidth}px)`;

        // Set border style
        boxRect.style.setProperty('--StrokeDashOffset',`${-xLen/2+boxRectLength/2}`) 
        boxRect.style.setProperty('--StrokeDashArray', `${boxRectLength},0`)

        pinPath.style.setProperty('--StrokeDashArray', `${pinPathLength},0`)
        //Change overlay opacity for blurryness
        overlay.classList.add("visible");
        const handleFocusTransitionEnd = () => {
            boxRect.classList.remove('grow-transition')
            pinPath.classList.remove('grow-transition')
            entry.classList.remove('grow-transition')
            entry.removeEventListener('transitionend', handleFocusTransitionEnd);
        };
        entry.addEventListener('transitionend', handleFocusTransitionEnd);
        entry.dataset.focused = "true";
        currFocusedEntry = entry;

      }
      function unfocusRect() {
        boxRect.classList.add('shrink-transition')
        pinPath.classList.add('shrrink-transition')
        entry.classList.add('shrink-transition')

        boxRect.style.setProperty('--StrokeDashOffset', `${-xLen/2}`) 
        boxRect.style.setProperty('--StrokeDashArray', `0,${boxRectLength}`)

        pinPath.style.setProperty('--StrokeDashArray', `0,${pinPathLength}`)
        
        entry.style.transform = `scale(1)`;
        entryInfo.style.transform = `translateY(0px)`;

        // Wait for both entry and entryInfo to finish transitioning
        const transitionEnded = (el) => new Promise((resolve) => {
          const handle = () => {
            el.removeEventListener('transitionend', handle);
            resolve();
          };
          el.addEventListener('transitionend', handle);
        });

        Promise.all([
          transitionEnded(entry),
          transitionEnded(entryInfo)
        ]).then(() => {
          overlay.classList.remove("visible");
          entry.classList.remove('shrink-transition')
          boxRect.classList.remove('shrink-transition')
          pinPath.classList.remove('shrrink-transition')
          setTimeout(() => {
            entry.classList.remove('z-top')
          }, 1000);

          
          entry.dataset.focused = "false";
          currFocusedEntry = null;
        });
      }

      if (entry.dataset.focused==="false") {
        focusRect()
      } else {
        unfocusRect()
      }
    });
  });
};
</script>
